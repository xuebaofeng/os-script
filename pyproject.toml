[project]
name = "os-script"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shawn Xue", email = "xbaofeng@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bs4>=0.0.2",
    "fpdf2==2.6.1",
    "google-api-python-client>=2.202.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "langdetect>=1.0.9",
    "mutagen>=1.48.1",
    "pillow>=13.0.0",
    "playsound==1.2.2",
    "pydub>=0.25.1",
    "pypinyin>=0.55.0",
    "requests>=2.34.2",
]

[project.scripts]
os-script = "os_script:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
